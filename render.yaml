services:
  - type: web
    name: mindmitra-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://ragul-gunasekaran.github.io,http://localhost:8000"
